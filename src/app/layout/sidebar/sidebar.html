<aside class="hidden lg:block h-screen p-4 sticky top-0 z-10">
  <div class="flex flex-col w-75 h-full bg-surface-card rounded-lg border border-border-default">
    <logo class="shrink-0 px-4 py-3.5" iconClass="h-11! w-11!" />
    <p-divider class="my-0! shrink-0" />
    <nav
      aria-label="Navegação principal"
      class="flex min-h-0 grow flex-col gap-1 overflow-y-auto px-2 py-3"
    >
      <p class="ml-3 my-1.5 text-xs font-semibold uppercase tracking-wider text-content-secondary">
        Navegação
      </p>
      <ul class="flex shrink-0 flex-col gap-1" role="list">
        @for (route of routes(); track $index) {
          <li class="flex flex-col">
            <p-button
              [routerLink]="[route.route]"
              routerLinkActive
              #rla="routerLinkActive"
              [severity]="isRouteActive(route.route, rla.isActive) ? null : 'secondary'"
              [text]="!isRouteActive(route.route, rla.isActive)"
              [label]="route.label"
              [pt]="navButtonPt(isRouteActive(route.route, rla.isActive))"
              fluid
            >
              <ng-template #icon>
                <svg
                  [lucideIcon]="route.icon"
                  class="h-4.5 w-4.5"
                  aria-hidden="true"
                  focusable="false"
                ></svg>
              </ng-template>
            </p-button>
          </li>
        }
      </ul>
    </nav>
    <p-divider class="my-0! shrink-0" />
    <div class="flex shrink-0 items-center justify-between p-2">
      <div class="flex items-center gap-3 rounded-md px-3 py-2">
        <span
          aria-hidden="true"
          class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold"
          [profileColor]="'#be222d'"
          >{{ username?.charAt(0).toUpperCase() + username?.charAt(1).toUpperCase() }}
        </span>
        <div class="leading-tight">
          <p class="text-sm font-semibold text-foreground">
            {{ username?.charAt(0).toUpperCase() + username?.slice(1) }}
          </p>
          <p class="text-xs text-content-secondary">{{ userRole }}</p>
        </div>
      </div>
      <p-button
        ariaLabel="Sair do sistema"
        [text]="true"
        severity="secondary"
        fluid
        (click)="onLogoutClick()"
      >
        <ng-template #icon>
          <svg lucideLogOut class="h-4.5 w-4.5" aria-hidden="true" focusable="false"></svg>
        </ng-template>
      </p-button>
    </div>
  </div>
</aside>
