<p-card [pt]="cardPt">
  <ng-template #header>
    <div class="flex items-center gap-3 border-b border-border-default bg-brand-primary-soft px-4 py-3">
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-brand-primary-subtle text-brand-primary"
      >
        <svg [lucideIcon]="icon()" class="h-4.5 w-4.5"></svg>
      </span>

      <div class="min-w-0">
        <h2 class="text-sm font-semibold text-content-primary sm:text-base">{{ title() }}</h2>
        <p class="text-xs text-content-secondary">{{ description() }}</p>
      </div>
    </div>
  </ng-template>

  <div class="p-4 sm:p-5">
    <ng-content />
  </div>
</p-card>
