<prontuario-header
  [data]="headerData()"
  [loading]="detailLoading()"
  [backLabel]="backConfig().label"
  [backUrl]="backConfig().url"
  (statusChange)="confirmarAlteracao.set(true)"
  (deleteRequest)="confirmarExclusao.set(true)"
/>

<p-tabs #abasProntuario [value]="abaAtiva()" (valueChange)="navegarParaAba($event)" scrollable>
  <p-tablist [pt]="{ tabList: { 'aria-label': 'Seções do prontuário' } }">
    @for (aba of abas; track aba.route) {
      <p-tab [value]="aba.route">
        <div class="flex items-center gap-2 whitespace-nowrap">
          <svg [lucideIcon]="aba.icon" class="h-4 w-4" aria-hidden="true" focusable="false"></svg>
          <span>{{ aba.label }}</span>
        </div>
      </p-tab>
    }
  </p-tablist>
</p-tabs>

@for (aba of abas; track aba.route) {
  @if (aba.route !== abaAtiva()) {
    <div
      hidden
      role="tabpanel"
      [id]="abasProntuario.id() + '_tabpanel_' + aba.route"
      [attr.aria-labelledby]="abasProntuario.id() + '_tab_' + aba.route"
    ></div>
  }
}
<div
  class="block min-w-0"
  role="tabpanel"
  tabindex="0"
  [id]="abasProntuario.id() + '_tabpanel_' + abaAtiva()"
  [attr.aria-labelledby]="abasProntuario.id() + '_tab_' + abaAtiva()"
>
  <router-outlet [routerOutletData]="outletData()" />
</div>

<confirm-dialog
  [(visible)]="confirmarAlteracao"
  [title]="toggleLabel() + ' acolhido'"
  [message]="toggleMessage()"
  [confirmLabel]="toggleLabel()"
  [severity]="toggleSeverity()"
  [loading]="mutationLoading()"
  (onConfirm)="alterarStatus()"
/>

@if (isAdmin) {
  <confirm-dialog
    [(visible)]="confirmarExclusao"
    title="Excluir acolhido"
    [message]="
      'Deseja excluir ' +
      (acolhido()?.nome ?? 'este acolhido') +
      '? Esta ação não poderá ser desfeita.'
    "
    confirmLabel="Excluir"
    severity="danger"
    [loading]="mutationLoading()"
    (onConfirm)="excluirAcolhido()"
  />
}
