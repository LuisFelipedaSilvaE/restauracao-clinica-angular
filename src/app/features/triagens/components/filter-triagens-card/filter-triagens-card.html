<card class="flex flex-wrap items-center gap-2">
  <p-iconfield class="min-w-70 basis-full grow-2 md:basis-[50%]">
    <p-inputicon>
      <svg lucideSearch class="h-4 w-4"></svg>
    </p-inputicon>
    <input
      pInputText
      [ngModel]="busca()"
      (ngModelChange)="this.buscaChange.emit($event)"
      placeholder="Buscar por nome, telefone ou convênio..."
      class="w-full placeholder:text-sm"
    />
  </p-iconfield>

  <p-iconfield class="min-w-45 basis-45 grow">
    <p-inputicon class="absolute left-3 top-1/2 z-10 mt-0! flex -translate-y-1/2 items-center">
      <svg lucideLayers class="h-5 w-5"></svg>
    </p-inputicon>
    <p-select
      [options]="convenios()"
      [ngModel]="convenioSelecionado()"
      (ngModelChange)="this.convenioSelecionadoChange.emit($event)"
      optionLabel="name"
      optionValue="code"
      placeholder="Selecione o convênio"
      class="w-full pl-7.5"
    >
      <ng-template #selectedItem let-selectedOption>
        <p class="text-content-primary text-sm truncate">
          Convênio: <span>{{ selectedOption.name }}</span>
        </p>
      </ng-template>
    </p-select>
  </p-iconfield>

  <p-iconfield class="min-w-45 basis-45 grow">
    <p-inputicon class="absolute left-3 top-1/2 z-10 mt-0! flex -translate-y-1/2 items-center">
      <svg lucideCalendar class="h-5 w-5"></svg>
    </p-inputicon>
    <p-select
      [options]="datas"
      [ngModel]="rangeDataSelecionado()"
      (ngModelChange)="this.rangeDataSelecionadoChange.emit($event)"
      optionLabel="name"
      optionValue="code"
      placeholder="Selecione o convênio"
      class="w-full pl-7.5"
    >
      <ng-template #selectedItem let-selectedOption>
        <p class="text-content-primary text-sm truncate">
          Data: <span>{{ selectedOption.name }}</span>
        </p>
      </ng-template>
    </p-select>
  </p-iconfield>
</card>
