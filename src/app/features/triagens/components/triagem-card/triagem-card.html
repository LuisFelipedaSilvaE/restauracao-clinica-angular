<card
  class="grid grid-cols-[auto_1fr_auto] sm:grid-cols-4 xl:grid-cols-5 items-center gap-x-3 gap-y-2 rounded-xl border border-border-default bg-surface-card p-3.5 transition-colors"
>
  <div
    class="col-span-2 col-start-1 row-start-1 sm:col-span-1 sm:col-start-2 flex min-w-0 items-center gap-2.5"
  >
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-semibold text-white"
      [profileColor]="'#be222d'"
    >
      {{ triagem().nomePossivelAcolhido | siglaNome }}
    </span>

    <p class="truncate text-sm sm:text-base font-semibold text-foreground">
      {{ triagem().nomePossivelAcolhido }}
    </p>
  </div>

  <div
    class="col-start-1 row-start-2 sm:col-start-1 sm:row-start-1 flex items-center gap-1 text-lg font-medium sm:font-semibold sm:text-foreground"
  >
    @if (triagem().dataAgendada) {
      {{ triagem().dataAgendada | date: 'HH:mm' }}
    } @else {
      --:--
    }
  </div>

  <div
    class="col-start-2 row-start-2 sm:row-start-1 sm:col-start-3 xl:col-start-4 justify-self-start sm:justify-self-center"
  >
    <p-tag [value]="triagem().modalidade.descricao" [customTag]="triagem().modalidade.cor" />
  </div>

  <p class="hidden xl:block xl:col-start-3 row-start-1 text-sm text-content-secondary text-center">
    {{ triagem().dataAgendada | date: 'dd/MM/yyyy' : '' : 'pt-BR' }}
  </p>

  <div
    class="col-start-3 row-span-2 sm:row-span-1 sm:col-start-4 xl:col-start-5 justify-self-end self-center flex items-center"
  >
    <p-menu #menu [model]="acoes()" [popup]="true" appendTo="body">
      <ng-template #item let-item>
        <div class="flex items-center gap-2 px-3 py-2 cursor-pointer">
          <svg [lucideIcon]="item.lucideIcon" [ngClass]="item.iconClass"></svg>
          <span>{{ item.label }}</span>
        </div>
      </ng-template>
    </p-menu>

    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-md text-content-secondary hover:bg-surface-subtle transition-colors"
      (click)="menu.toggle($event)"
    >
      <svg lucideEllipsisVertical class="h-5 w-5"></svg>
    </button>
  </div>
</card>
