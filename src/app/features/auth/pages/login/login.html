<main class="flex min-h-svh items-center justify-center bg-surface-app p-4">
  <div class="grid w-full max-w-4xl overflow-hidden rounded-2xl bg-card shadow-xl md:grid-cols-2">
    <div
      class="hidden flex-col justify-center gap-6 bg-brand-primary p-10 text-content-on-primary md:flex"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-heart-handshake h-14 w-14"
        aria-hidden="true"
      >
        <path
          d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"
        ></path>
      </svg>
      <div class="space-y-3">
        <h2 class="text-2xl font-semibold text-balance">Comunidade Restauração</h2>
        <p class="text-sm leading-relaxed text-content-on-primary/80 text-pretty">
          Transformando vidas através do cuidado, respeito e restauração contínua.
        </p>
      </div>
    </div>
    <div class="flex flex-col justify-center gap-6 p-8 sm:p-10">
      <div class="flex items-center gap-2">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-md bg-brand-primary text-content-on-primary"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-heart-handshake h-5 w-5"
            aria-hidden="true"
          >
            <path
              d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"
            ></path></svg></span
        ><span class="text-lg font-semibold text-foreground">Clínica Restauração</span>
      </div>
      <div class="space-y-1">
        <p class="text-xs font-semibold uppercase tracking-wider text-brand-primary">
          Acesso restrito
        </p>
        <h1 class="text-2xl font-semibold text-foreground">Bem-vindo de volta</h1>
        <p class="text-sm text-content-secondary text-pretty">
          Insira suas credenciais para acessar o sistema clínico.
        </p>
      </div>
      <form class="space-y-5">
        <div class="space-y-2">
          <label for="username" class="text-sm font-medium text-foreground">Usuário</label>
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-user pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-secondary"
              aria-hidden="true"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="username"
              type="text"
              autocomplete="username"
              placeholder="seu.usuario"
              class="h-11 w-full rounded-md border border-input bg-surface-app pl-10 pr-3 text-sm text-foreground placeholder:text-content-secondary focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
            />
          </div>
        </div>
        <div class="space-y-2">
          <label for="password" class="text-sm font-medium text-foreground">Senha</label>
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-lock pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-secondary"
              aria-hidden="true"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              class="h-11 w-full rounded-md border border-input bg-surface-app pl-10 pr-10 text-sm text-foreground placeholder:text-content-secondary focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
            /><button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-content-secondary transition-colors hover:text-foreground"
              aria-label="Mostrar senha"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-eye h-4 w-4"
                aria-hidden="true"
              >
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                ></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button
          type="submit"
          tabindex="0"
          data-slot="button"
          class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 bg-brand-primary text-content-on-primary [a]:hover:bg-brand-primary/80 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 h-11 w-full gap-2 text-sm font-medium"
        >
          Entrar<svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-log-in h-4 w-4"
            aria-hidden="true"
          >
            <path d="m10 17 5-5-5-5"></path>
            <path d="M15 12H3"></path>
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>
</main>
