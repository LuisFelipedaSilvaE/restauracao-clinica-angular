<main class="flex min-h-svh items-center justify-center bg-surface-app p-4">
  <div
    class="grid w-full max-w-4xl overflow-hidden rounded-2xl bg-surface-card shadow-xl md:grid-cols-2"
  >
    <div
      class="hidden flex-col justify-center gap-6 bg-brand-primary p-10 text-content-on-primary md:flex"
    >
      <svg lucideHeartHandshake strokeWidth="1.5" class="h-14 w-14" aria-hidden="true"></svg>
      <div class="space-y-3">
        <h2 class="text-2xl font-semibold text-balance">Comunidade Restauração</h2>
        <p class="text-sm leading-relaxed text-content-on-primary/80 text-pretty">
          Transformando vidas através do cuidado, respeito e restauração contínua.
        </p>
      </div>
    </div>
    <div class="flex flex-col justify-center gap-6 bg-surface-card p-8 sm:p-10">
      <div class="flex items-center gap-2">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-md bg-brand-primary text-content-on-primary"
          ><svg
            lucideHeartHandshake
            strokeWidth="1.75"
            class="h-5 w-5"
            aria-hidden="true"
          ></svg></span
        ><span class="text-lg font-semibold text-content-primary">Clínica Restauração</span>
      </div>
      <div class="space-y-1">
        <p
          class="text-xs font-semibold uppercase tracking-wider text-brand-primary flex gap-1.5 items-center"
        >
          <svg
            lucideLockKeyhole
            strokeWidth="2.5"
            class="h-3.5 w-3.5 mb-0.5"
            aria-hidden="true"
          ></svg>
          Acesso restrito
        </p>
        <h1 class="text-2xl font-semibold text-content-primary">Bem-vindo de volta</h1>
        <p class="text-sm text-content-secondary text-pretty">
          Insira suas credenciais para acessar o sistema clínico.
        </p>
      </div>
      <form class="space-y-5">
        <div class="space-y-2">
          <label for="username" class="text-sm font-medium text-content-primary">Usuário</label>
          <div class="relative">
            <svg
              lucideUser
              class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-secondary"
              aria-hidden="true"
            ></svg>
            <input
              id="username"
              type="text"
              autocomplete="username"
              placeholder="seu.usuario"
              class="h-11 w-full rounded-md border border-border-default bg-surface-app pl-10 pr-3 text-sm text-content-primary placeholder:text-content-secondary focus:border-brand-primary focus:outline-none focus:ring-2 focus:ring-brand-primary/30"
            />
          </div>
        </div>
        <div class="space-y-2">
          <label for="password" class="text-sm font-medium text-content-primary">Senha</label>
          <div class="relative">
            <svg
              lucideLock
              class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-secondary"
              aria-hidden="true"
            ></svg>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              class="h-11 w-full rounded-md border border-border-default bg-surface-app pl-10 pr-10 text-sm text-content-primary placeholder:text-content-secondary focus:border-brand-primary focus:outline-none focus:ring-2 focus:ring-brand-primary/30"
            /><button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-content-secondary transition-colors hover:text-content-primary"
              aria-label="Mostrar senha"
            >
              <svg lucideEye class="h-4 w-4" aria-hidden="true"></svg>
            </button>
          </div>
        </div>
        <button
          type="submit"
          class="flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand-primary px-4 text-sm font-medium text-content-on-primary transition-colors hover:bg-brand-primary-hover focus-visible:ring-2 focus-visible:ring-brand-primary/30 focus-visible:outline-none disabled:pointer-events-none disabled:opacity-50"
        >
          Entrar<svg lucideLogIn class="h-4 w-4" aria-hidden="true"></svg>
        </button>
      </form>
    </div>
  </div>
</main>
