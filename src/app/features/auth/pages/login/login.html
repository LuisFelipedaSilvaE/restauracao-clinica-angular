<main class="flex min-h-svh items-center justify-center bg-surface-app p-4">
  <div
    class="grid w-full max-w-4xl overflow-hidden rounded-2xl bg-surface-card shadow-xl md:grid-cols-2"
  >
    <div
      class="hidden flex-col justify-center gap-6 bg-brand-primary p-10 text-content-on-primary md:flex"
    >
      <svg lucideHeartHandshake strokeWidth="1.5" class="h-14 w-14" aria-hidden="true"></svg>
      <div class="space-y-3">
        <h2 class="text-2xl font-semibold text-balance">Comunidade Restauração</h2>
        <p class="text-sm leading-relaxed text-content-on-primary/80 text-pretty">
          Transformando vidas através do cuidado, respeito e restauração contínua.
        </p>
      </div>
    </div>
    <div class="flex flex-col justify-center gap-6 bg-surface-card p-8 sm:p-10">
      <logo />
      <div class="space-y-1">
        <p
          class="text-xs font-semibold uppercase tracking-wider text-brand-primary flex gap-1.5 items-center"
        >
          <svg
            lucideLockKeyhole
            strokeWidth="2.5"
            class="h-3.5 w-3.5 mb-0.5"
            aria-hidden="true"
          ></svg>
          Acesso restrito
        </p>
        <h1 class="text-2xl font-semibold text-content-primary">Bem-vindo de volta</h1>
        <p class="text-sm text-content-secondary text-pretty">
          Insira suas credenciais para acessar o sistema clínico.
        </p>
      </div>
      <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <form-field
          label="Usuário"
          inputId="usuario"
          required
          [errorMessage]="getErrorMessage('usuario')"
        >
          <p-iconfield>
            <p-inputicon>
              <svg lucideUser class="w-5 h-5 -mt-0.5"></svg>
            </p-inputicon>
            <input
              pInputText
              formControlName="usuario"
              [invalid]="isInvalid('usuario')"
              autocomplete="off"
              placeholder="seu.usuario"
              id="usuario"
              [attr.aria-describedby]="isInvalid('usuario') ? 'usuario-erro' : null"
              fluid
            />
          </p-iconfield>
        </form-field>
        <form-field
          label="Senha"
          inputId="senha"
          required
          [errorMessage]="getErrorMessage('senha')"
        >
          <p-iconfield>
            <p-inputicon>
              <svg lucideLock class="w-4 h-4"></svg>
            </p-inputicon>
            <p-password
              #passwordInput
              formControlName="senha"
              [class.tracking-widest]="!passwordInput.unmasked"
              [invalid]="isInvalid('senha')"
              [toggleMask]="true"
              [feedback]="false"
              autocomplete="off"
              placeholder="••••••••••"
              inputId="senha"
              [attr.aria-describedby]="isInvalid('senha') ? 'senha-erro' : null"
              fluid
              [pt]="passwordInputPt"
            />
          </p-iconfield>
        </form-field>
        <p-button
          type="submit"
          [pt]="{ root: { class: 'w-full!' } }"
          [label]="loginButtonContent()"
          [disabled]="loginForm.invalid || requestActive()"
          iconPos="right"
          fluid
        >
          <ng-template #icon>
            <svg
              [lucideIcon]="loginButtonIcon()"
              class="h-4 w-4 order-2"
              [class.animate-spin]="requestActive()"
              aria-hidden="true"
            ></svg>
          </ng-template>
        </p-button>
      </form>
    </div>
  </div>
</main>
