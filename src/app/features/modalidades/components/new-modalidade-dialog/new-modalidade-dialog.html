<p-dialog
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '25rem' }"
  dismissableMask="true"
  [pt]="dialogPt"
>
  <ng-template #header>
    <info-card class="p-0! border-none! bg-transparent" [data]="headerInfo" />
  </ng-template>
  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="visibleChange.emit(false)" />
    <p-button label="Save" (click)="visibleChange.emit(false)" />
  </div>
</p-dialog>
