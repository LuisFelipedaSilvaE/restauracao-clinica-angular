<form-header [data]="headerInfo()" btnLabel="Voltar para modalidades" btnUrl="/modalidades" />

@if (carregando()) {
  <card class="flex flex-col gap-5 p-6!">
    @for (campo of skeletonCampos; track $index) {
      <div class="flex flex-col gap-2">
        <p-skeleton class="h-4! w-40! rounded-md!" />
        <p-skeleton class="h-10! w-full! rounded-lg!" />
      </div>
    }
  </card>
} @else {
  <form [formGroup]="modalidadeForm" (ngSubmit)="onSubmit()">
    <card class="flex flex-col gap-6 p-6!">
      <div class="flex flex-col gap-5">
        <form-field
          label="Nome da modalidade"
          inputId="descricao"
          required
          [errorMessage]="getErrorMessage('descricao')"
        >
          <input
            pInputText
            fluid
            formControlName="descricao"
            id="descricao"
            name="descricao"
            [invalid]="isInvalid('descricao')"
            [attr.aria-describedby]="isInvalid('descricao') ? 'descricao-erro' : null"
            placeholder="Ex.: Particular, Convênio, Bolsa social..."
            autocomplete="off"
          />
        </form-field>

        <form-field label="CNPJ" inputId="cnpj" [errorMessage]="getErrorMessage('cnpj')">
          <input
            pInputText
            fluid
            formControlName="cnpj"
            pInputMask="**.***.***/****-99"
            id="cnpj"
            name="cnpj"
            class="uppercase"
            [invalid]="isInvalid('cnpj')"
            [attr.aria-describedby]="isInvalid('cnpj') ? 'cnpj-erro' : null"
            placeholder="AA.AAA.AAA/AAAA-00"
            autocomplete="off"
          />
        </form-field>

        <form-field
          label="Quantidade de vagas"
          inputId="maxVagas"
          required
          [errorMessage]="getErrorMessage('maxVagas')"
        >
          <p-inputnumber
            formControlName="maxVagas"
            inputId="maxVagas"
            name="maxVagas"
            [min]="0"
            [maxFractionDigits]="0"
            styleClass="w-full"
            placeholder="Ex.: 40"
            [invalid]="isInvalid('maxVagas')"
            [ariaDescribedBy]="isInvalid('maxVagas') ? 'maxVagas-erro' : undefined"
            autocomplete="off"
            locale="pt-BR"
          />
        </form-field>

        <form-field
          label="Pagamento obrigatório"
          inputId="pagamento"
          required
          [errorMessage]="getErrorMessage('pagamento')"
        >
          <p-selectbutton
            [options]="pagamentoOptions"
            formControlName="pagamento"
            optionLabel="label"
            optionValue="value"
            [allowEmpty]="false"
            [fluid]="true"
            ariaLabelledBy="pagamento-label"
          />
        </form-field>

        <form-field
          label="Cor de identificação"
          inputId="cor"
          required
          [errorMessage]="getErrorMessage('cor')"
        >
          <p-colorpicker formControlName="cor" inputId="cor" appendTo="body" />
        </form-field>
        <div class="flex flex-col gap-2">
          <p class="text-xs font-semibold text-content-secondary">Pré-visualização</p>
          @if (modalidadeForm.valid) {
            <modalidade-card [modalidade]="modalidadePreview()!" [showActions]="false" />
          } @else {
            <div class="rounded-xl border border-border-default bg-surface-card p-4">
              <div class="mb-3 flex items-center justify-between gap-4">
                <div class="flex items-center gap-2.5">
                  <p-skeleton class="h-10! w-10! rounded-lg!" />
                  <p-skeleton class="h-5! w-24! rounded-md! bg-surface-200! dark:bg-surface-700!" />
                  <p-skeleton class="h-5! w-14! rounded-full!" />
                </div>

                <div class="flex gap-5">
                  <p-skeleton
                    class="h-5! w-5! rounded-full! bg-surface-200! dark:bg-surface-700!"
                  />
                  <p-skeleton class="h-5! w-5! rounded-full!" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                @for (_ of [1, 2]; track $index) {
                  <div
                    class="flex items-center gap-2.5 rounded-xl border border-border-default bg-surface-subtle p-3"
                  >
                    <p-skeleton
                      class="h-10! w-10! rounded-lg! bg-surface-200! dark:bg-surface-700!"
                    />
                    <div class="flex flex-1 flex-col gap-1.5">
                      <p-skeleton
                        class="h-4! w-8! rounded-md! bg-surface-200! dark:bg-surface-700!"
                      />
                      <p-skeleton
                        class="h-3! w-3/4! rounded-md! bg-surface-200! dark:bg-surface-700!"
                      />
                    </div>
                  </div>
                }
              </div>

              <div class="mt-3">
                <div class="mb-1.5 flex items-center justify-between">
                  <p-skeleton class="h-3! w-16! rounded-md! bg-surface-200! dark:bg-surface-700!" />
                  <p-skeleton class="h-3! w-7! rounded-md! bg-surface-200! dark:bg-surface-700!" />
                </div>
                <p-skeleton class="h-2! w-full! rounded-full!" />
              </div>
            </div>
            <p class="text-center text-xs font-semibold text-content-secondary">
              Preencha todos os campos corretamente para visualizar.
            </p>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2 border-t border-border-default pt-5">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [disabled]="loading().mutation"
          (click)="voltarParaLista()"
        />
        <p-button
          type="submit"
          [label]="actionBtnLabel()"
          severity="primary"
          [loading]="loading().mutation"
          [disabled]="loading().mutation"
        >
        </p-button>
      </div>
    </card>
  </form>
}
