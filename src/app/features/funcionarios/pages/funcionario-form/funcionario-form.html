<form-header [data]="headerInfo()" btnLabel="Voltar para funcionários" btnUrl="/funcionarios" />
<card>
  <form [formGroup]="funcionarioForm" class="space-y-5" (ngSubmit)="onSubmit()">
    <fieldset class="space-y-4">
      <legend class="font-semibold">Dados pessoais</legend>
      <form-field
        label="Nome completo"
        inputId="nome"
        required
        [errorMessage]="getErrorMessage('nome')"
      >
        <input
          pInputText
          id="nome"
          name="nome"
          formControlName="nome"
          placeholder="Ex.: Maria da Silva"
          [invalid]="isInvalid('nome')"
          [attr.aria-describedby]="isInvalid('nome') ? 'nome-erro' : null"
          fluid
          autocomplete="off"
        />
      </form-field>
      <div class="grid gap-4 sm:grid-cols-2">
        <form-field label="CPF" inputId="cpf" required [errorMessage]="getErrorMessage('cpf')">
          <input
            pInputText
            id="cpf"
            name="cpf"
            formControlName="cpf"
            placeholder="000.000.000-00"
            pInputMask="999.999.999-99"
            [invalid]="isInvalid('cpf')"
            [attr.aria-describedby]="isInvalid('cpf') ? 'cpf-erro' : null"
            fluid
            autocomplete="off"
          />
        </form-field>
        <form-field
          label="Data de nascimento"
          inputId="dataNascimento"
          required
          [errorMessage]="getErrorMessage('dataNascimento')"
        >
          <p-datepicker
            inputId="dataNascimento"
            name="dataNascimento"
            formControlName="dataNascimento"
            placeholder="dd/mm/aaaa"
            [showButtonBar]="true"
            [readonlyInput]="true"
            [maxDate]="minDataNascimento"
            [defaultDate]="minDataNascimento"
            [invalid]="isInvalid('dataNascimento')"
            dateFormat="dd/mm/yy"
            fluid
          />
        </form-field>
      </div>
    </fieldset>
    <p-divider />
    <fieldset class="space-y-4">
      <legend class="font-semibold">Vínculo</legend>
      <form-field
        label="Data de admissão"
        inputId="dataAdmissao"
        required
        [errorMessage]="getErrorMessage('dataAdmissao')"
      >
        <p-datepicker
          inputId="dataAdmissao"
          name="dataAdmissao"
          formControlName="dataAdmissao"
          placeholder="dd/mm/aaaa"
          [maxDate]="hoje"
          [showButtonBar]="true"
          [readonlyInput]="true"
          [invalid]="isInvalid('dataAdmissao')"
          dateFormat="dd/mm/yy"
          fluid
        />
      </form-field>
    </fieldset>
    <p-divider />
    <fieldset class="space-y-4">
      <legend class="font-semibold">Contato</legend>
      <div class="grid gap-4 sm:grid-cols-2">
        <form-field
          label="E-mail"
          inputId="email"
          required
          [errorMessage]="getErrorMessage('email')"
        >
          <input
            pInputText
            id="email"
            name="email"
            formControlName="email"
            placeholder="nome@clinica.org"
            [invalid]="isInvalid('email')"
            [attr.aria-describedby]="isInvalid('email') ? 'email-erro' : null"
            fluid
            autocomplete="off"
          />
        </form-field>
        <form-field
          label="Telefone"
          inputId="telefone"
          required
          [errorMessage]="getErrorMessage('telefone')"
        >
          <input
            pInputText
            id="telefone"
            name="telefone"
            formControlName="telefone"
            pInputMask="(99) 99999-9999"
            placeholder="(00) 00000-0000"
            [invalid]="isInvalid('telefone')"
            [attr.aria-describedby]="isInvalid('telefone') ? 'telefone-erro' : null"
            [autoClear]="false"
            fluid
            autocomplete="off"
          />
        </form-field>
      </div>
    </fieldset>
    <p-divider />
    <fieldset class="space-y-4">
      <legend class="font-semibold">Endereço</legend>
      <div class="grid gap-4 sm:grid-cols-6">
        <form-field
          class="sm:col-span-2"
          label="CEP"
          inputId="cep"
          required
          [errorMessage]="getErrorMessage('cep')"
        >
          <input
            pInputText
            id="cep"
            name="cep"
            formControlName="cep"
            pInputMask="99999-999"
            placeholder="00000-000"
            [invalid]="isInvalid('cep')"
            [attr.aria-describedby]="isInvalid('cep') ? 'cep-erro' : null"
            fluid
            autocomplete="off"
          />
        </form-field>
        <ng-container formGroupName="endereco">
          <form-field
            class="sm:col-span-3"
            label="Bairro"
            inputId="bairro"
            required
            [errorMessage]="getErrorMessage('endereco.bairro')"
          >
            <input
              pInputText
              id="bairro"
              name="bairro"
              formControlName="bairro"
              placeholder="Bairro"
              [invalid]="isInvalid('endereco.bairro')"
              [attr.aria-describedby]="isInvalid('endereco.bairro') ? 'bairro-erro' : null"
              [pKeyFilter]="blockslashandhyphen"
              fluid
              autocomplete="off"
            />
          </form-field>
          <form-field
            label="Número"
            inputId="numero"
            required
            [errorMessage]="getErrorMessage('endereco.numero')"
          >
            <input
              pInputText
              id="numero"
              name="numero"
              formControlName="numero"
              pKeyFilter="int"
              placeholder="Nº"
              [invalid]="isInvalid('endereco.numero')"
              [attr.aria-describedby]="isInvalid('endereco.numero') ? 'numero-erro' : null"
              fluid
              autocomplete="off"
            />
          </form-field>
          <form-field
            class="sm:col-span-full"
            label="Logradouro"
            inputId="logradouro"
            required
            [errorMessage]="getErrorMessage('endereco.logradouro')"
          >
            <input
              pInputText
              id="logradouro"
              name="logradouro"
              formControlName="logradouro"
              placeholder="Rua, avenida..."
              [invalid]="isInvalid('endereco.logradouro')"
              [attr.aria-describedby]="isInvalid('endereco.logradouro') ? 'logradouro-erro' : null"
              fluid
              autocomplete="off"
            />
          </form-field>
          <form-field
            class="sm:col-span-6"
            label="Complemento"
            inputId="complemento"
            [errorMessage]="getErrorMessage('endereco.complemento')"
          >
            <input
              pInputText
              id="complemento"
              name="complemento"
              formControlName="complemento"
              placeholder="Casa, apartamento..."
              [invalid]="isInvalid('endereco.complemento')"
              [attr.aria-describedby]="
                isInvalid('endereco.complemento') ? 'complemento-erro' : null
              "
              fluid
              autocomplete="off"
            />
          </form-field>
          <form-field
            class="sm:col-span-3"
            label="Cidade"
            inputId="cidade"
            required
            [errorMessage]="getErrorMessage('endereco.cidade')"
          >
            <input
              pInputText
              id="cidade"
              name="cidade"
              formControlName="cidade"
              placeholder="Cidade"
              [invalid]="isInvalid('endereco.cidade')"
              [attr.aria-describedby]="isInvalid('endereco.cidade') ? 'cidade-erro' : null"
              fluid
              autocomplete="off"
            />
          </form-field>
          <form-field
            class="sm:col-span-3"
            label="Estado"
            inputId="estado"
            required
            [errorMessage]="getErrorMessage('endereco.estado')"
          >
            <p-select
              inputId="estado"
              name="estado"
              [options]="estados"
              formControlName="estado"
              placeholder="Selecione um estado"
              [invalid]="isInvalid('endereco.estado')"
              fluid
            />
          </form-field>
        </ng-container>
      </div>
    </fieldset>
    <p-divider />
    <fieldset class="space-y-4">
      <div class="flex items-center justify-between">
        <legend class="font-semibold">Acesso ao sistema</legend>
      </div>

      <div class="grid gap-4 sm:grid-cols-2" formGroupName="user">
        <form-field
          class="sm:col-span-2"
          label="Cargo"
          inputId="cargo"
          required
          [errorMessage]="getErrorMessage('user.cargo')"
        >
          <p-select
            inputId="cargo"
            name="cargo"
            [options]="cargos()"
            formControlName="cargo"
            optionLabel="nome"
            optionValue="id"
            placeholder="Selecione um cargo"
            [invalid]="isInvalid('user.cargo')"
            fluid
          />
        </form-field>
        <form-field
          label="Usuário"
          inputId="username"
          required
          [errorMessage]="getErrorMessage('user.username')"
        >
          <input
            pInputText
            id="username"
            name="username"
            formControlName="username"
            placeholder="user.do.funcionario"
            [invalid]="isInvalid('user.username')"
            [attr.aria-describedby]="isInvalid('user.username') ? 'username-erro' : null"
            [pKeyFilter]="blockspace"
            fluid
            autocomplete="off"
          />
        </form-field>
        <form-field
          label="Senha"
          inputId="password"
          required
          [errorMessage]="getErrorMessage('user.password')"
        >
          <p-password
            #passwordInput
            inputId="password"
            name="password"
            formControlName="password"
            [class.tracking-widest]="!passwordInput.unmasked"
            [toggleMask]="true"
            [feedback]="false"
            [pKeyFilter]="blockspace"
            autocomplete="off"
            placeholder="••••••••••"
            [invalid]="isInvalid('user.password')"
            [attr.aria-describedby]="isInvalid('user.password') ? 'password-erro' : null"
            [pt]="passwordInputPt"
            fluid
          />
        </form-field>
      </div>
    </fieldset>
    <p-divider />
    <div class="flex justify-end gap-2">
      <p-button (onClick)="limparForm()" severity="secondary" variant="outlined" label="Cancelar" />
      <p-button type="submit" severity="primary" [label]="actionBtnLabel()" />
    </div>
  </form>
</card>
