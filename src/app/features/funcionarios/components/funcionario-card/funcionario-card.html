<div
  class="flex min-w-0 items-center gap-2 rounded-lg text-left transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-primary/40 2xl:gap-3"
>
  <span
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
    [profileColor]="'#be222d'"
    >{{ funcionario().nome | siglaNome }}
  </span>
  <div class="min-w-0">
    <p class="truncate font-semibold text-content-primary">
      {{ funcionario().nome }}
    </p>
    <p class="truncate text-xs text-content-secondary">
      CPF {{ funcionario().cpf | cpf }}
    </p>
  </div>
</div>

<div class="contents">
  <div class="hidden min-w-0 text-center text-sm text-content-secondary md:block">
    <p class="truncate">{{ funcionario().telefone | telefone }}</p>
    <p class="truncate text-xs">{{ funcionario().email }}</p>
  </div>

  <div class="hidden min-w-0 text-center text-sm text-content-secondary xl:block">
    <p class="truncate">{{ funcionario().dataNascimento | date: 'dd/MM/yyyy' }}</p>
    <p class="truncate text-xs">{{ idade() }} anos</p>
  </div>

  <p-tag
    class="col-start-1 row-start-2 justify-self-start sm:col-auto sm:row-auto sm:justify-self-center"
    [value]="funcionario().cargo?.nome"
  />

  <div
    class="col-start-2 row-start-1 row-span-2 justify-self-center sm:col-auto sm:row-span-1 sm:justify-self-end"
  >
    <action-menu [actions]="acoes()" ariaLabel="Abrir ações do funcionário" />
  </div>
</div>
