<div class="flex flex-col gap-4">
  <div class="flex flex-col md:justify-between md:flex-row gap-2">
    <div>
      <h4 class="text-2xl font-semibold mb-1">Estoque de medicamentos</h4>
      <p class="text-sm text-content-secondary">
        Acompanhe o estoque de medicamentos e registre cada movimentação.
      </p>
    </div>
    <p-button label="Novo medicamento" routerLink="criar" class="text-nowrap">
      <ng-template #icon>
        <svg lucidePlus class="h-5 w-5"></svg>
      </ng-template>
    </p-button>
  </div>
  <div class="flex justify-center items-center flex-wrap gap-2.5">
    @for (item of infomedicamentos(); track $index) {
      <info-card [data]="item" />
    }
  </div>
</div>

@if (loading().list || medicamentos().length > 0) {
  <medicamento-grid [medicamentos]="medicamentos()" [loading]="loading().list" />
} @else {
  <empty-list
    [icon]="emptyMedicamentosIcon"
    title="Nenhum medicamento cadastrado"
    description="Não há medicamentos cadastrados no momento."
  >
    <p-button routerLink="criar" label="Cadastrar primeiro medicamento">
      <ng-template #icon>
        <svg lucidePlus class="h-5 w-5"></svg>
      </ng-template>
    </p-button>
  </empty-list>
}
