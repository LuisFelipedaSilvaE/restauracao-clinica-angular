<div class="flex flex-col gap-4">
  <page-header
    title="Estoque de medicamentos"
    description="Acompanhe o estoque de medicamentos e registre cada movimentação."
  >
    <a pButton routerLink="criar" class="text-nowrap">
      <svg pButtonIcon lucidePlus class="h-5 w-5" aria-hidden="true" focusable="false"></svg>

      <span pButtonLabel>Novo medicamento</span></a
    >
  </page-header>
  <div class="flex justify-center items-center flex-wrap gap-2.5">
    @for (item of infomedicamentos(); track $index) {
      <info-card [data]="item" />
    }
  </div>
</div>

@if (loading().list || medicamentos().length > 0) {
  <medicamento-grid [medicamentos]="medicamentos()" [loading]="loading().list" />
} @else {
  <empty-list
    [icon]="emptyMedicamentosIcon"
    title="Nenhum medicamento cadastrado"
    description="Não há medicamentos cadastrados no momento."
  >
    <a pButton routerLink="criar">
      <svg pButtonIcon lucidePlus class="h-5 w-5" aria-hidden="true" focusable="false"></svg>

      <span pButtonLabel>Cadastrar primeiro medicamento</span></a
    >
  </empty-list>
}
