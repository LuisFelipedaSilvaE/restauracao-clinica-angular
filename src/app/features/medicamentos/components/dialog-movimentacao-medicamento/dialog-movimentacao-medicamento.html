<p-dialog
  [restoreDialogFocus]="visible()"
  [modal]="true"
  [(visible)]="visible"
  [focusOnShow]="true"
  [closable]="!medicamentosService.loading().mutation"
  [dismissableMask]="!medicamentosService.loading().mutation"
  styleClass="w-md!"
>
  <ng-template #header let-titleId="ariaLabelledBy">
    <h2 [id]="titleId" class="text-lg font-semibold">{{ config().title }}</h2>
  </ng-template>

  @if (type()) {
    <div class="flex flex-col gap-5 mt-0.5">
      <p-message [severity]="config().severity" (ngSubmit)="atualizarQuantidadeEstoque()">
        <div class="flex justify-center items-center gap-2">
          <span
            class="flex justify-center items-center w-10 h-10 p-2 rounded-md"
            [class]="type() === 'entrada' ? 'bg-green-200' : 'bg-yellow-200'"
          >
            <svg
              [lucideIcon]="config().msgIcon"
              class="h-5 w-5"
              aria-hidden="true"
              focusable="false"
            ></svg>
          </span>
          <div>
            <p class="font-bold">
              {{ medicamento().nome }}
            </p>
            <p class="font-normal">
              Saldo atual:
              <strong>{{ medicamento().quantidadeEstoque | number: '1.0-0' }}</strong>
            </p>
          </div>
        </div>
      </p-message>

      <form
        autoFocusError
        #formFocus="autoFocusError"
        [formGroup]="form"
        class="flex flex-col gap-4"
      >
        <form-field
          label="Quantidade"
          inputId="quantidade"
          [errorMessage]="getErrorMessage('quantidade')"
          required
        >
          <p-inputNumber
            autocomplete="off"
            inputId="quantidade"
            formControlName="quantidade"
            [invalid]="isInvalid('quantidade')"
            placeholder="0"
            [min]="1"
            [max]="quantidadeMaxima"
            [maxFractionDigits]="0"
            locale="pt-BR"
            [useGrouping]="true"
            fluid
          />
        </form-field>
      </form>
    </div>
  }

  <ng-template #footer>
    <p-button
      type="button"
      label="Cancelar"
      severity="secondary"
      [disabled]="medicamentosService.loading().mutation"
      (click)="limparFormulario()"
    />

    <p-button
      [label]="config().btnLabel"
      [severity]="config().severity"
      [loading]="medicamentosService.loading().mutation"
      [disabled]="medicamentosService.loading().mutation"
      (onClick)="atualizarQuantidadeEstoque(); formFocus.focusInvalidControl()"
    />
  </ng-template>
</p-dialog>
