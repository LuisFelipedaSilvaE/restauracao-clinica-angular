<p-dataview
  [value]="loading() ? skeletonCards : medicamentos()"
  [paginator]="!loading()"
  [attr.aria-busy]="loading()"
  [rows]="10"
  layout="list"
  [pt]="dataviewPt"
>
  <ng-template #list let-items>
    <div class="flex min-w-0 flex-col gap-2">
      <div
        class="hidden sm:grid sm:grid-cols-[minmax(0,1.2fr)_minmax(0,2fr)_minmax(0,1fr)_auto] gap-2 text-xs font-semibold uppercase tracking-wide text-content-secondary px-4"
      >
        <span class="text-center">Medicamento</span>
        <span class="text-center">Disponibilidade</span>
        <span class="block text-center">Preço</span>
        <span class="justify-self-end text-center">Ações</span>
      </div>

      <div class="flex flex-col gap-2">
        @if (loading()) {
          <span class="sr-only" role="status">Carregando medicamentos...</span>
          @for (_ of skeletonCards; track $index) {
            <div
              aria-hidden="true"
              class="grid grid-cols-[auto_1fr_auto] sm:grid-cols-4 items-center gap-x-3 gap-y-2 rounded-xl border border-border-default bg-surface-card p-3.5"
            >
              <div
                class="col-span-2 col-start-1 row-start-1 sm:col-span-1 sm:col-start-2 flex min-w-0 items-center gap-2.5"
              >
                <p-skeleton shape="circle" size="2.5rem" class="shrink-0" />
                <p-skeleton width="8rem" height="1rem" />
              </div>
              <p-skeleton
                class="col-start-1 row-start-2 sm:col-start-1 sm:row-start-1"
                width="3rem"
                height="1rem"
                borderRadius="0.25rem"
              />
              <p-skeleton
                class="col-start-2 row-start-2 sm:col-start-3 xl:col-start-4 justify-self-start sm:justify-self-center"
                width="6rem"
                height="1.5rem"
                borderRadius="0.375rem"
              />
              <p-skeleton
                class="hidden xl:block xl:col-start-3 row-start-1 justify-self-center"
                width="5rem"
                height="1rem"
                borderRadius="0.25rem"
              />
              <p-skeleton
                class="col-start-3 row-span-2 sm:row-span-1 sm:col-start-4 xl:col-start-5 justify-self-end self-center"
                size="2.25rem"
                borderRadius="0.375rem"
              />
            </div>
          }
        } @else {
          @for (medicamento of items; track $index) {
            <medicamento-card
              [medicamento]="medicamento"
              (onEntrada)="aumentarQuantidadeEstoque($event)"
              (onSaida)="reduzirQuantidadeEstoque($event)"
              (onDelete)="enableConfirmDialog($event)"
            />
          }
        }
      </div>
    </div>
  </ng-template>
  <ng-template #emptymessage>
    <empty-list
      [icon]="emptySearchIcon"
      title="Nenhum medicamento cadastrado"
      description="Ainda não há medicamentos registrados. Cadastre o primeiro para começar a controlar o estoque."
    >
      <p-button severity="secondary" [text]="true" routerLink="criar" label="Cadastrar medicamento">
        <svg lucidePlus class="h-5 w-5"></svg>
      </p-button>
    </empty-list>
  </ng-template>
</p-dataview>

<dialog-movimentacao-medicamento
  [(visible)]="dialogVisible"
  [type]="typeMovimentacao()"
  [medicamento]="medicamentoMovimentacao()"
/>

<confirm-dialog
  [(visible)]="confirmarExclusao"
  title="Excluir medicamento"
  [message]="
    'Deseja excluir ' +
    (medicamentoMovimentacao()?.nome ?? 'este medicamento') +
    '? Esta ação não poderá ser desfeita.'
  "
  confirmLabel="Excluir"
  severity="danger"
  [loading]="loading()"
  (onConfirm)="excluirMedicamento()"
/>
