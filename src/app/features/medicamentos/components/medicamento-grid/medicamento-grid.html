<p-dataview
  [value]="loading() ? skeletonCards : medicamentos()"
  [paginator]="!loading()"
  [attr.aria-busy]="loading()"
  [rows]="10"
  layout="list"
  [pt]="dataviewPt"
>
  <ng-template #list let-items>
    <div class="flex min-w-0 flex-col gap-2">
      <div
        class="hidden sm:grid sm:grid-cols-[minmax(0,1.2fr)_minmax(0,2fr)_minmax(0,1fr)_auto] gap-2 text-xs font-semibold uppercase tracking-wide text-content-secondary px-4"
      >
        <span class="text-center">Medicamento</span>
        <span class="text-center">Disponibilidade</span>
        <span class="block text-center">Preço</span>
        <span class="justify-self-end text-center">Ações</span>
      </div>

      <div class="flex flex-col gap-2">
        @if (loading()) {
          <span class="sr-only" role="status">Carregando medicamentos...</span>
          @for (_ of skeletonCards; track $index) {
            <div
              aria-hidden="true"
              class="grid grid-cols-[auto_1fr_auto] sm:grid-cols-[minmax(0,1.2fr)_minmax(0,2fr)_minmax(0,1fr)_auto] items-center gap-x-3 gap-y-2 rounded-xl border border-border-default bg-surface-card p-3.5"
            >
              <div class="col-span-2 row-start-1 sm:col-span-1 flex min-w-0 items-center gap-3">
                <p-skeleton size="2.5rem" class="shrink-0" />
                <p-skeleton width="10rem" height="1rem" />
              </div>
              <p-skeleton
                class="text-xs! sm:hidden! row-start-2"
                width="6rem"
                height="1.25rem"
                borderRadius="0.375rem"
              />
              <div
                class="row-start-3 col-span-2 flex min-w-0 flex-col items-start justify-center gap-1 sm:row-start-1 sm:col-span-1"
              >
                <p-skeleton
                  width="6rem"
                  height="1.25rem"
                  borderRadius="0.375rem"
                  class="hidden! sm:block!"
                />
                <div class="flex w-full min-w-0 items-center gap-2">
                  <p-skeleton class="h-2! min-w-0 flex-1" />
                  <p-skeleton width="4.5rem" height="0.875rem" />
                </div>
              </div>
              <div
                class="col-start-2 row-start-2 sm:row-start-1 sm:col-start-3 flex items-center sm:justify-center gap-2"
              >
                <p-skeleton width="4.5rem" height="1rem" />
              </div>
              <div
                class="col-start-3 row-span-3 flex justify-center items-center sm:col-start-4 sm:row-span-1 sm:justify-end"
              >
                <p-skeleton size="2.25rem" borderRadius="0.375rem" />
              </div>
            </div>
          }
        } @else {
          @for (medicamento of items; track $index) {
            <medicamento-card
              [medicamento]="medicamento"
              (onEntrada)="aumentarQuantidadeEstoque($event)"
              (onSaida)="reduzirQuantidadeEstoque($event)"
              (onDelete)="enableConfirmDialog($event)"
            />
          }
        }
      </div>
    </div>
  </ng-template>
  <ng-template #emptymessage>
    <empty-list
      [icon]="emptySearchIcon"
      title="Nenhum medicamento encontrado"
      description="Não encontramos resultados para os filtros aplicados."
    >
    </empty-list>
  </ng-template>
</p-dataview>

<dialog-movimentacao-medicamento
  [(visible)]="dialogVisible"
  [type]="typeMovimentacao()"
  [medicamento]="medicamentoMovimentacao()"
/>

<confirm-dialog
  [(visible)]="confirmarExclusao"
  title="Excluir medicamento"
  [message]="
    'Deseja excluir ' +
    (medicamentoMovimentacao()?.nome ?? 'este medicamento') +
    '? Esta ação não poderá ser desfeita.'
  "
  confirmLabel="Excluir"
  severity="danger"
  [loading]="loading()"
  (onConfirm)="excluirMedicamento()"
/>
