<card
  class="grid! grid-cols-[auto_1fr_auto] sm:grid-cols-[minmax(0,1.2fr)_minmax(0,2fr)_minmax(0,1fr)_auto] gap-2"
>
  <div class="col-span-2 row-start-1 sm:col-span-1 flex min-w-0 items-center gap-3">
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
      iconColor="#be222d"
    >
      <svg lucidePill class="h-5 w-5"></svg>
    </span>
    <p class="truncate text-sm font-semibold text-foreground">{{ medicamento().nome }}</p>
  </div>
  <p-tag
    [value]="statusMedicamento().tag.label"
    [severity]="statusMedicamento().tag.severity"
    class="text-xs! sm:hidden! row-start-2"
  />
  <div
    class="row-start-3 col-span-2 flex min-w-0 flex-col items-start justify-center gap-1 sm:row-start-1 sm:col-span-1"
  >
    <p-tag
      [value]="statusMedicamento().tag.label"
      [severity]="statusMedicamento().tag.severity"
      class="text-xs! hidden! sm:block!"
    />

    <div class="flex w-full min-w-0 items-center gap-2 -mt-1 sm:mt-0">
      <p-progressbar
        class="h-2! min-w-0 flex-1"
        [value]="porcentagemEstoque()"
        showValue="false"
        [customProgressbar]="statusMedicamento().pb.severity"
      />

      <p class="shrink-0 text-sm text-content-secondary text-nowrap">
        <strong class="text-content-primary">
          {{ medicamento().quantidadeEstoque }}
        </strong>
        / mín. {{ medicamento().quantidadeMinima }}
      </p>
    </div>
  </div>
  <div
    class="col-start-2 row-start-2 sm:row-start-1 sm:col-start-3 flex items-center sm:justify-center gap-2"
  >
    <span class="text-sm text-content-secondary">
      {{ medicamento().preco | currency: 'BRL' : 'symbol' : '1.2-2' }}
    </span>
  </div>
  <div
    class="col-start-3 row-span-3 flex justify-center items-center sm:col-start-4 sm:row-span-1 sm:justify-end"
  >
    <p-button severity="secondary" [text]="true" (onClick)="menu.toggle($event)">
      <ng-template #icon>
        <svg lucideEllipsisVertical class="h-5 w-5"></svg>
      </ng-template>
    </p-button>
    <p-menu #menu [model]="acoes" [popup]="true" appendTo="body">
      <ng-template #item let-item>
        <div class="flex cursor-pointer items-center gap-2 px-3 py-2">
          <svg [lucideIcon]="item.lucideIcon" [class]="item.iconClass"></svg>
          <span>{{ item.label }}</span>
        </div>
      </ng-template>
    </p-menu>
  </div>
</card>
