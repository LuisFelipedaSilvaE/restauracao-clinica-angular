<div class="flex w-full min-w-0 flex-col gap-2 sm:flex-row sm:items-center sm:gap-4">
  <div class="flex min-w-0 items-center gap-3 sm:flex-1 sm:gap-4">
    <div class="w-fit shrink-0 rounded-md p-2.5" [iconColor]="convenio().cor">
      <svg lucideLayers class="h-5 w-5" aria-hidden="true" focusable="false"></svg>
    </div>
    <div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-4">
      <h2 class="min-w-0 flex-1 truncate text-lg font-medium tracking-tight">
        {{ convenio().descricao }}
        <span class="sr-only"> — {{ convenio().ativo ? 'Ativo' : 'Inativo' }}</span>
      </h2>
      <p-badge
        class="shrink-0"
        [value]="`${convenio().maxVagas} Vagas`"
        [customBadge]="convenio().cor"
      />
    </div>
  </div>
  @if (showActions()) {
    <div class="flex h-full w-full items-start justify-end gap-1 sm:w-auto sm:shrink-0">
      <a
        pButton
        [routerLink]="convenio().id"
        pTooltip="Visualizar convênio"
        tooltipPosition="top"
        severity="info"
        [text]="true"
        class="p-button-icon-only"
        [attr.aria-label]="'Visualizar convênio' + ': ' + convenio().descricao"
      >
        <svg pButtonIcon lucideEye class="h-4.5 w-4.5" aria-hidden="true" focusable="false"></svg>
      </a>
      @if (convenio().ativo) {
        <a
          pButton
          [routerLink]="convenio().id + '/editar'"
          pTooltip="Editar convênio"
          tooltipPosition="top"
          severity="secondary"
          [text]="true"
          class="p-button-icon-only"
          [attr.aria-label]="'Editar convênio' + ': ' + convenio().descricao"
        >
          <svg pButtonIcon lucidePencil class="h-4 w-4" aria-hidden="true" focusable="false"></svg>
        </a>
      }
      <p-button
        (onClick)="toggleConvenio()"
        [severity]="computedConvenioAtivoBtn().severity"
        [pTooltip]="computedConvenioAtivoBtn().tooltipValue"
        tooltipPosition="top"
        [text]="true"
        [ariaLabel]="computedConvenioAtivoBtn().tooltipValue + ': ' + convenio().descricao"
      >
        <ng-template #icon>
          <svg
            [lucideIcon]="computedConvenioAtivoBtn().icon"
            class="h-4 w-4"
            aria-hidden="true"
            focusable="false"
          ></svg>
        </ng-template>
      </p-button>
      @if (isAdmin) {
        <p-button
          (onClick)="solicitarExclusao()"
          severity="danger"
          pTooltip="Excluir convênio"
          tooltipPosition="top"
          [text]="true"
          [ariaLabel]="'Excluir convênio' + ': ' + convenio().descricao"
        >
          <ng-template #icon>
            <svg lucideTrash2 class="h-4 w-4" aria-hidden="true" focusable="false"></svg>
          </ng-template>
        </p-button>
      }
    </div>
  }
</div>
<div class="grid w-full min-w-0 grid-cols-1 gap-2 min-[400px]:grid-cols-2 sm:gap-4">
  @for (item of computedInfoCards(); track $index) {
    <info-card class="min-w-0 bg-surface-subtle! p-3!" [data]="item" />
  }
</div>
<div class="flex w-full min-w-0 flex-col">
  <div class="mb-1 flex w-full min-w-0 justify-between gap-2">
    <p class="text-xs text-content-secondary">Ocupação</p>
    <p class="shrink-0 text-xs font-semibold text-content-on-card">
      {{ `${computedOcupacao()}%` }}
    </p>
  </div>

  @if (convenio().ativo) {
    <p-progressbar
      [attr.aria-label]="'Ocupação de ' + convenio().descricao"
      class="h-2! mb-2"
      showValue="false"
      [value]="computedOcupacao()"
      [customProgressbar]="convenio().cor"
    />
  }
</div>
