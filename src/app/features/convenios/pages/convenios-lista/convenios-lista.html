<div class="flex flex-col gap-4">
  <page-header
    title="Convênios"
    description="Gerencie os convênios de acolhimento e a disponibilidade de vagas de cada um."
  >
    <a pButton routerLink="criar" class="text-nowrap">
      <svg pButtonIcon lucidePlus class="h-5 w-5" aria-hidden="true" focusable="false"></svg>

      <span pButtonLabel>Novo convênio</span></a
    >
  </page-header>
  <div class="flex justify-center items-center flex-wrap gap-2.5">
    @for (item of infoConvenios(); track $index) {
      <info-card [data]="item" />
    }
  </div>
</div>
<div
  [attr.role]="!loading().list && convenios().length ? 'list' : null"
  aria-label="Convênios"
  [attr.aria-busy]="loading().list"
  class="grid min-w-0 grid-cols-1 gap-4 md:grid-cols-[repeat(auto-fit,minmax(384px,1fr))]"
>
  @if (loading().list) {
    <span class="sr-only" role="status">Carregando convênios...</span>
    @for (_ of skeletonCards; track $index) {
      <div aria-hidden="true" class="rounded-xl border border-border-default bg-surface-card p-4">
        <div class="mb-3 flex items-center justify-between gap-4">
          <div class="flex items-center gap-2.5">
            <p-skeleton class="h-10! w-10! rounded-lg!" />
            <p-skeleton class="h-5! w-24! rounded-md! bg-surface-200! dark:bg-surface-700!" />
            <p-skeleton class="h-5! w-14! rounded-full!" />
          </div>

          <div class="flex gap-5">
            <p-skeleton class="h-5! w-5! rounded-full! bg-surface-200! dark:bg-surface-700!" />
            <p-skeleton class="h-5! w-5! rounded-full!" />
          </div>
        </div>

        <div class="grid grid-cols-1 gap-3 min-[400px]:grid-cols-2">
          @for (_ of [1, 2]; track $index) {
            <div
              class="flex items-center gap-2.5 rounded-xl border border-border-default bg-surface-subtle p-3"
            >
              <p-skeleton class="h-10! w-10! rounded-lg! bg-surface-200! dark:bg-surface-700!" />
              <div class="flex flex-1 flex-col gap-1.5">
                <p-skeleton class="h-4! w-8! rounded-md! bg-surface-200! dark:bg-surface-700!" />
                <p-skeleton class="h-3! w-3/4! rounded-md! bg-surface-200! dark:bg-surface-700!" />
              </div>
            </div>
          }
        </div>

        <div class="mt-3">
          <div class="mb-1.5 flex items-center justify-between">
            <p-skeleton class="h-3! w-16! rounded-md! bg-surface-200! dark:bg-surface-700!" />
            <p-skeleton class="h-3! w-7! rounded-md! bg-surface-200! dark:bg-surface-700!" />
          </div>
          <p-skeleton class="h-2! w-full! rounded-full!" />
        </div>
      </div>
    }
  } @else {
    @for (item of convenios(); track $index) {
      <convenio-card
        role="listitem"
        (statusConvenioChange)="toggleConvenio($event)"
        (excluirConvenio)="solicitarExclusao($event)"
        [convenio]="item"
      />
    } @empty {
      <empty-list
        [icon]="emptyConveniosIcon"
        title="Nenhum convênio encontrado"
        description="Não há convênios de acolhimento cadastrados no momento."
      >
        <a pButton routerLink="criar">
          <svg pButtonIcon lucidePlus class="h-5 w-5" aria-hidden="true" focusable="false"></svg>

          <span pButtonLabel>Cadastrar primeiro convênio</span></a
        >
      </empty-list>
    }
  }
</div>

<confirm-dialog
  [(visible)]="dialogConfirmVisible"
  [title]="confirmTitle()"
  [message]="confirmMessage()"
  [confirmLabel]="confirmLabel()"
  [severity]="confirmSeverity()"
  [loading]="loading().mutation"
  (hidden)="this.acaoPendente.set(null)"
  (onConfirm)="confirmarAcao()"
/>
