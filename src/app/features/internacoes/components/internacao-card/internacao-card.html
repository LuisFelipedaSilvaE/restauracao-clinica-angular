<div class="flex min-w-0 items-center gap-2 text-left 2xl:gap-3">
  <span
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
    [iconColor]="internacao().convenio.cor"
  >
    <svg lucideBedSingle class="h-5 w-5" aria-hidden="true" focusable="false"></svg>
  </span>

  <div class="min-w-0">
    <h2 class="truncate font-semibold text-foreground">
      {{ internacao().acolhido.nome }}
    </h2>
    <p class="truncate text-xs text-content-secondary">CPF {{ internacao().acolhido.cpf | cpf }}</p>
  </div>
</div>

<time
  class="hidden text-center text-sm text-content-secondary md:block"
  [attr.datetime]="dataEntrada()"
>
  {{ dataEntrada() | date: 'dd MMM yyyy' : '' : 'pt-BR' }}
</time>

<time
  class="hidden text-center text-sm text-content-secondary md:block"
  [attr.datetime]="dataSaidaExibida()"
>
  {{ dataSaidaExibida() | date: 'dd MMM yyyy' : '' : 'pt-BR' }}
</time>

<p class="hidden text-center text-sm text-content-secondary md:block">
  {{ internacao().tempoInternado }}
</p>

<p-tag
  class="col-start-1 row-start-2 justify-self-start sm:col-auto sm:row-auto sm:justify-self-center"
  [value]="etapaConfig().label"
  [severity]="etapaConfig().severity"
/>

<div
  class="col-start-2 row-start-1 row-span-2 justify-self-center sm:col-auto sm:row-span-1 sm:justify-self-end"
>
  <action-menu
    [actions]="acoes()"
    [ariaLabel]="'Abrir ações da internação: ' + internacao().acolhido.nome"
  />
</div>
