<card class="flex flex-col gap-4">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex min-w-0 items-center gap-2">
      <div
        class="flex w-fit shrink-0 items-center justify-center rounded-md p-2.5"
        [iconColor]="'#be222d'"
      >
        <svg lucideBriefcase class="h-5 w-5"></svg>
      </div>
      <div class="min-w-0">
        <h6 class="text-lg font-semibold">Cargos</h6>
        <p class="text-content-secondary text-xs">
          Gerencie os cargos disponíveis para vincular aos colaboradores.
        </p>
      </div>
    </div>
    <div class="w-full shrink-0 sm:w-auto">
      <p-button
        label="Novo cargo"
        severity="secondary"
        variant="outlined"
        styleClass="w-full whitespace-nowrap"
        (onClick)="registerCargo()"
      >
        <ng-template #icon>
          <svg lucidePlus class="h-5 w-5"></svg>
        </ng-template>
      </p-button>
    </div>
  </div>
  @if (loading().list) {
    <div aria-busy="true">
      <span class="sr-only" role="status">Carregando cargos...</span>
      <div
        class="grid grid-cols-1 items-center gap-2 md:grid-cols-[repeat(auto-fit,minmax(320px,1fr))]"
      >
        @for (_ of skeletonCards; track $index) {
          <div
            aria-hidden="true"
            class="flex items-center justify-between gap-2 rounded-xl border border-border-default bg-surface-subtle/20 p-3"
          >
            <div class="flex min-w-0 flex-1 flex-col gap-2">
              <p-skeleton width="75%" height="1rem" />
              <div class="flex gap-1">
                <p-skeleton width="3rem" height="1.5rem" borderRadius="0.375rem" />
                <p-skeleton width="6rem" height="1.5rem" borderRadius="0.375rem" />
              </div>
            </div>
            <div class="flex shrink-0 gap-1">
              @for (_ of [1, 2]; track $index) {
                <p-skeleton size="2.5rem" borderRadius="0.375rem" />
              }
            </div>
          </div>
        }
      </div>
    </div>
  } @else if (cargos().length > 0) {
    <p-dataview [value]="cargos()" [paginator]="true" [rows]="6" layout="grid" [pt]="dataviewPt">
      <ng-template #grid let-items>
        <div
          class="grid grid-cols-1 items-center gap-2 md:grid-cols-[repeat(auto-fit,minmax(320px,1fr))]"
        >
          @for (cargo of items; track cargo.id) {
            <cargo-card
              [cargo]="cargo"
              (statusCargoChange)="toggleCargo($event)"
              (onEditCargo)="editCargo($event)"
            />
          }
        </div>
      </ng-template>
    </p-dataview>
  } @else {
    <empty-list
      [icon]="emptyCargosIcon"
      title="Nenhum cargo cadastrado"
      description="Ainda não há cargos registrados no sistema. Comece adicionando o primeiro cargo."
    >
      <p-button
        label="Criar primeiro cargo"
        severity="secondary"
        variant="outlined"
        (onClick)="registerCargo()"
      >
        <ng-template #icon>
          <svg lucidePlus class="h-5 w-5"></svg>
        </ng-template>
      </p-button>
    </empty-list>
  }
</card>

<confirm-dialog
  [(visible)]="dialogConfirmVisible"
  [title]="confirmTitle()"
  [message]="confirmMessage()"
  [confirmLabel]="confirmLabel()"
  [severity]="confirmSeverity()"
  [loading]="loading().mutation"
  (hidden)="this.acaoPendente.set(null)"
  (onConfirm)="confirmarAlteracaoStatus()"
/>

<cargo-form
  [(visible)]="updateDialogVisible"
  [loading]="loading().mutation"
  [cargo]="this.cargoToUpdate()"
/>
