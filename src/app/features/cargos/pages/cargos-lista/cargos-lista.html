<p class="sr-only" role="status" aria-live="polite" aria-atomic="true">
  {{ !loading().list ? cargosFiltrados().length + ' resultados encontrados' : '' }}
</p>
<div class="flex min-w-0 flex-col gap-4">
  <div class="flex flex-wrap items-center gap-2">
    <p-iconfield class="min-w-64 basis-full grow sm:basis-[60%]">
      <p-inputicon
        ><svg lucideSearch class="h-4 w-4" aria-hidden="true" focusable="false"></svg
      ></p-inputicon>
      <input
        aria-label="Buscar cargos por nome"
        pInputText
        [ngModel]="busca()"
        (ngModelChange)="busca.set($event)"
        placeholder="Buscar por nome do cargo..."
        class="w-full placeholder:text-sm"
        autocomplete="off"
      />
    </p-iconfield>

    <p-select
      ariaLabel="Filtrar cargos por situação"
      class="min-w-44 grow md:max-w-52"
      [options]="situacoes"
      [ngModel]="situacaoSelecionada()"
      (ngModelChange)="situacaoSelecionada.set($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="Situação"
    />

    <p-button
      type="button"
      label="Novo cargo"
      severity="secondary"
      variant="outlined"
      styleClass="w-full whitespace-nowrap sm:w-auto"
      (onClick)="registerCargo()"
    >
      <ng-template #icon>
        <svg lucidePlus class="h-5 w-5" aria-hidden="true" focusable="false"></svg>
      </ng-template>
    </p-button>
  </div>

  @if (loading().list) {
    <div aria-busy="true">
      <span class="sr-only" role="status">Carregando cargos...</span>
      <div
        class="grid grid-cols-1 items-center gap-2 md:grid-cols-[repeat(auto-fit,minmax(320px,1fr))]"
      >
        @for (_ of skeletonCards; track $index) {
          <div
            aria-hidden="true"
            class="flex items-center justify-between gap-2 rounded-xl border border-border-default bg-surface-subtle/20 p-3"
          >
            <div class="flex min-w-0 flex-1 flex-col gap-2">
              <p-skeleton width="75%" height="1rem" />
              <div class="flex gap-1">
                <p-skeleton width="3rem" height="1.5rem" borderRadius="0.375rem" />
                <p-skeleton width="6rem" height="1.5rem" borderRadius="0.375rem" />
              </div>
            </div>
            <div class="flex shrink-0 gap-1">
              @for (_ of [1, 2]; track $index) {
                <p-skeleton size="2.5rem" borderRadius="0.375rem" />
              }
            </div>
          </div>
        }
      </div>
    </div>
  } @else if (cargos().length === 0) {
    <empty-list
      [icon]="emptyCargosIcon"
      title="Nenhum cargo cadastrado"
      description="Ainda não há cargos registrados no sistema. Comece adicionando o primeiro cargo."
    >
      <p-button
        type="button"
        label="Criar primeiro cargo"
        severity="secondary"
        variant="outlined"
        (onClick)="registerCargo()"
      >
        <ng-template #icon>
          <svg lucidePlus class="h-5 w-5" aria-hidden="true" focusable="false"></svg>
        </ng-template>
      </p-button>
    </empty-list>
  } @else {
    <p-dataview
      [value]="cargosFiltrados()"
      [paginator]="true"
      [rows]="6"
      layout="grid"
      [pt]="dataviewPt"
    >
      <ng-template #grid let-items>
        <div
          role="list"
          aria-label="Resultados"
          class="grid grid-cols-1 items-center gap-2 md:grid-cols-[repeat(auto-fit,minmax(320px,1fr))]"
        >
          @for (cargo of items; track cargo.id) {
            <cargo-card
              role="listitem"
              [cargo]="cargo"
              (statusCargoChange)="toggleCargo($event)"
              (onEditCargo)="editCargo($event)"
            />
          }
        </div>
      </ng-template>

      <ng-template #emptymessage>
        <empty-list
          [icon]="emptySearchIcon"
          title="Nenhum cargo encontrado"
          description="Não encontramos resultados para os filtros aplicados. Tente ajustar a busca ou limpar os filtros."
        >
          <p-button
            type="button"
            label="Limpar filtros"
            severity="secondary"
            [text]="true"
            (onClick)="clearFilters()"
          >
            <ng-template #icon>
              <svg lucideFunnelX class="h-5 w-5" aria-hidden="true" focusable="false"></svg>
            </ng-template>
          </p-button>
        </empty-list>
      </ng-template>
    </p-dataview>
  }
</div>

<confirm-dialog
  [(visible)]="dialogConfirmVisible"
  [title]="confirmTitle()"
  [message]="confirmMessage()"
  [confirmLabel]="confirmLabel()"
  [severity]="confirmSeverity()"
  [loading]="loading().mutation"
  (hidden)="this.acaoPendente.set(null)"
  (onConfirm)="confirmarAlteracaoStatus()"
/>

<cargo-form
  [(visible)]="updateDialogVisible"
  [loading]="loading().mutation"
  [cargo]="this.cargoToUpdate()"
/>
