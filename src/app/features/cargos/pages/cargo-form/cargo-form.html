<p-dialog
  [modal]="true"
  [visible]="visible()"
  [focusOnShow]="false"
  [closable]="!loading()"
  [dismissableMask]="!loading()"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="hidden.emit($event)"
  styleClass="w-md!"
>
  <ng-template #header>
    <h2 class="text-lg font-semibold">{{ currentState().title }}</h2>
  </ng-template>

  <form id="cargoForm" [formGroup]="cargoForm" class="space-y-5" (ngSubmit)="salvarAlteracoes()">
    <form-field
      label="Nome do cargo"
      inputId="nome"
      required
      [errorMessage]="getErrorMessage('nome')"
    >
      <input
        pInputText
        id="nome"
        name="nome"
        formControlName="nome"
        placeholder="Ex.: Maria da Silva"
        [invalid]="isInvalid('nome')"
        [attr.aria-describedby]="isInvalid('nome') ? 'nome-erro' : null"
        fluid
        autocomplete="off"
      />
    </form-field>
  </form>

  <ng-template #footer>
    <p-button
      type="button"
      label="Cancelar"
      severity="secondary"
      [disabled]="loading()"
      (click)="visibleChange.emit(false)"
    />

    <p-button
      type="submit"
      form="cargoForm"
      [label]="currentState().btnLabel"
      severity="priamry"
      [loading]="loading()"
      [disabled]="loading()"
      (click)="salvarAlteracoes()"
    />
  </ng-template>
</p-dialog>
