<back-button [label]="btnLabel()" [url]="btnUrl()" />

<div class="flex items-center gap-2">
  <div class="w-fit p-3.5 rounded-md flex justify-center items-center" [iconColor]="data().color">
    <svg [lucideIcon]="data().icon!" class="h-6 w-6"></svg>
  </div>
  <div>
    <h6 class="text-xl font-semibold">{{ data().value }}</h6>
    <p class="text-content-secondary">{{ data().label }}</p>
  </div>
</div>
