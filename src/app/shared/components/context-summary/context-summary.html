<section
  class="min-w-0 overflow-hidden rounded-xl border border-border-default bg-surface-card"
  [attr.aria-label]="title()"
>
  <div class="flex min-w-0 items-center gap-2.5 border-b border-border-default px-4 py-3">
    <span
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md"
      [iconColor]="color()"
    >
      <svg [lucideIcon]="icon()" class="h-4 w-4" aria-hidden="true" focusable="false"></svg>
    </span>
    @if (headingLevel() === 2) {
      <h2 class="text-sm font-semibold text-content-primary">{{ title() }}</h2>
    } @else {
      <h3 class="text-sm font-semibold text-content-primary">{{ title() }}</h3>
    }
  </div>

  <div
    class="grid min-w-0 grid-cols-[repeat(auto-fit,minmax(9rem,1fr))] gap-x-6 gap-y-3 px-4 py-3 text-sm"
  >
    <ng-content />
  </div>
</section>
