<p-dialog
  [restoreDialogFocus]="visible()"
  [modal]="true"
  role="alertdialog"
  [pt]="{ root: { 'aria-describedby': descriptionId } }"
  [visible]="visible()"
  [focusOnShow]="true"
  [closable]="!loading()"
  [dismissableMask]="!loading()"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="hidden.emit()"
>
  <ng-template #header let-titleId="ariaLabelledBy">
    <h2 [id]="titleId" class="text-lg font-semibold">{{ title() }}</h2>
  </ng-template>

  <p [id]="descriptionId" class="text-sm text-content-secondary">
    {{ message() }}
  </p>

  <ng-template #footer>
    <p-button
      type="button"
      label="Cancelar"
      [autofocus]="true"
      severity="secondary"
      [disabled]="loading()"
      (click)="visibleChange.emit(false)"
    />

    <p-button
      [label]="confirmLabel()"
      [severity]="severity()"
      [loading]="loading()"
      [disabled]="loading()"
      (click)="onConfirm.emit()"
    />
  </ng-template>
</p-dialog>
