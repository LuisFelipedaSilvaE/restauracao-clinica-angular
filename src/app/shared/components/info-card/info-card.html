<div class="w-fit p-2.5 rounded-md" [iconColor]="data().color">
  <svg [lucideIcon]="data().icon!" class="h-5 w-5" aria-hidden="true" focusable="false"></svg>
</div>
<dl class="flex flex-col-reverse">
  <dt class="text-xs text-content-secondary">{{ data().label }}</dt>
  <dd class="text-lg font-semibold">{{ data().value }}</dd>
</dl>
